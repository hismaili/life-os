# Client authentication for the LifeOS dev/CD Postgres container.
#
# `local` (unix socket) stays trust — it's only used for in-container
# maintenance (e.g. the `pg_isready` healthcheck), never by the app, which
# always connects over TCP as the "postgres" compose service.
#
# Every TCP connection must present a client certificate signed by our CA
# (see scripts/generate-dev-certs.sh) and use TLS; there is no password
# fallback.
#
# TYPE    DATABASE   USER   ADDRESS       METHOD
local     all        all                  trust
hostssl   all        all    0.0.0.0/0     cert
hostssl   all        all    ::0/0         cert
