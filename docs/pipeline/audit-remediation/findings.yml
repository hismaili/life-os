  - id: NOTION-AUD-001
    raised_by: spring-auditor
    stage: audit
    severity: High
    symptom: "Notion token could be rendered in NotionProperties string representation (toString/interpolation/binding-error)"
    evidence: "NotionProperties.java:15-22; NotionPropertiesTest.toString_redactsTokenToFixedMarker; NotionProvisioningAdapterTest.client_neverLeaksTokenInExceptionMessage"
    citation: "OWASP Cheat Sheet Series — Logging (never log secrets); OWASP ASVS v4.0 V7; Effective Java Item 12"
    suspected_layer: impl
    proposes_decision: false
    status: closed
    owner: spring-implementer
    owner_history: []
    target_artifacts: ["backend/src/main/java/com/lifeos/infrastructure/adapter/notion/NotionProperties.java"]
    resolution: "Explicit toString() renders token as fixed '****' marker; token() still returns raw value for Bearer header only. Non-regression: NotionPropertiesTest + adapter hasMessageNotContaining(TOKEN)/(\"Bearer\") assertions."
