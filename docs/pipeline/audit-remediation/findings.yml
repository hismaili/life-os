  # ---- new findings from the final-gate re-audit (routed back) ----
  - id: AUD-101
    raised_by: spring-auditor
    stage: audit
    severity: Low
    symptom: "Sanitized generic detail interpolates the raw enum constant (e.g. 'internal error during TASKS_DB provisioning'), re-introducing the enum name into operator-facing CLI text that AUD-005 removed from the step label"
    evidence: "CreateWorkspaceService.java:105 (rendered via WorkspaceCommands.java:46-48; asserted at CreateWorkspaceServiceTest.java:341)"
    citation: "Effective Java Item 34 (enum name/default toString is an identifier, not display text)"
    suspected_layer: impl
    proposes_decision: false
    status: closed
    owner: spring-implementer
    owner_history: []
    target_artifacts: ["backend/src/main/java/com/lifeos/application/usecase/workspace/CreateWorkspaceService.java"]
    resolution: "safeDetail no longer interpolates the enum: it returns a constant GENERIC_FAILURE_DETAIL='internal error during provisioning (see server logs)' (CreateWorkspaceService.java:101,108) with no type token, and the 'type' parameter was dropped from the safeDetail signature. Raw cause + type are still logged server-side at ERROR (:96). Non-regression: CreateWorkspaceServiceTest.execute_collapsesUnexpectedExceptionToGenericSafeDetail asserts detail equals the constant AND doesNotContain('TASKS_DB')/('jdbc')/('internal-host') (:341-344). Scoped re-audit 2026-08-07 CONFIRMED CLOSED."
  - id: AUD-102
    raised_by: spring-auditor
    stage: audit
    severity: Low
    symptom: "safeDetail returns e.getMessage() unguarded for SafeToSurfaceException/UnsupportedOperationException; a null/blank message would trip ProvisioningStepResult's non-blank FAILED-detail invariant, throwing IllegalArgumentException inside the catch block and letting it escape execute() — breaking the per-step fail-closed contract"
    evidence: "CreateWorkspaceService.java:102-103 (catch at 95-98); ProvisioningStepResult.java:9-12"
    citation: "Effective Java Item 77 (don't ignore exceptions) / Item 54 (defensive handling of possibly-null returns)"
    suspected_layer: impl
    proposes_decision: false
    status: closed
    owner: spring-implementer
    owner_history: []
    target_artifacts: ["backend/src/main/java/com/lifeos/application/usecase/workspace/CreateWorkspaceService.java"]
    resolution: "safeDetail now coalesces a null/blank curated message to the non-blank GENERIC_FAILURE_DETAIL constant (CreateWorkspaceService.java:104-107), so a FAILED ProvisioningStepResult can never receive a null/blank detail and the compact-constructor invariant cannot trip inside the catch. Non-regression: CreateWorkspaceServiceTest.execute_fallsBackToGenericDetailWhenSafeToSurfaceExceptionHasNoMessage throws new NotionApiException((String) null) (a SafeToSurfaceException) and asserts outcome FAILED + detail equals the fallback with no exception escaping execute() (:347-366). Scoped re-audit 2026-08-07 CONFIRMED CLOSED."
