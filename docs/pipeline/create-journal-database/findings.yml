  - id: AUD-13
    raised_by: spring-auditor
    stage: audit
    severity: Low
    symptom: "JournalEntry declares a public @Builder, giving the application layer an alternate construction path that bypasses the self-validating create(...) factory — builder().content(null).workspaceId(null).build() (or minting a caller id) assembles an entity in a state create(...) forbids. The audited baseline Project/Task close this with @Builder(access=AccessLevel.PRIVATE). Pre-existing (not introduced by this change; the edit added the title field/param only) and shared with Area/Habit/Knowledge/Review/Resource; no current call site exploits it."
    evidence: "backend/src/main/java/com/lifeos/domain/journal/JournalEntry.java:10 (public @Builder) vs backend/src/main/java/com/lifeos/domain/project/Project.java:11 and backend/src/main/java/com/lifeos/domain/task/Task.java:11 (@Builder(access = AccessLevel.PRIVATE))"
    citation: "Effective Java, Item 15: Minimize the accessibility of classes and members; project CLAUDE.md convention (all-args builder reserved for repository reconstitution; application layer must never mint IDs or assemble an entity in an invalid state)"
    suspected_layer: impl
    proposes_decision: false
    status: closed
    owner: spring-implementer
    owner_history: [spring-implementer]
    target_artifacts: [backend/src/main/java/com/lifeos/domain/journal/JournalEntry.java]
    resolution: "Fixed on JournalEntry (the file this feature owns): @Builder -> @Builder(access = AccessLevel.PRIVATE), matching Project/Task/Goal and closing the un-validated construction back door. Safe: grep confirmed the factory's own create(...) is the only builder() caller (no prod/test call site used the public builder), and ./mvnw verify stayed green (compile-time proof) — failsafe 25/25, BUILD SUCCESS on Podman. NOTE: the same public-@Builder pattern remains on Area/Habit/Knowledge/Review/Resource (pre-existing, out of this feature's scope) — see BUILDER-SWEEP tracked follow-up."
  - id: BUILDER-SWEEP
    raised_by: orchestrator
    stage: remediation
    severity: Low
    symptom: "Cross-cutting: Area, Habit, Knowledge, Review, and Resource domain aggregates still declare a public @Builder (un-validated construction back door around their create(...) factories), inconsistent with Person/Workspace/Project/Task/Goal/JournalEntry which use @Builder(access = AccessLevel.PRIVATE). Pre-existing tech debt spanning multiple aggregates; no current call site exploits it."
    evidence: "backend/src/main/java/com/lifeos/domain/{area/Area,habit/Habit,knowledge/Knowledge,review/Review,resource/Resource}.java (public @Builder)"
    citation: "Effective Java, Item 15; CLAUDE.md self-validating-domain convention"
    suspected_layer: impl
    proposes_decision: false
    status: closed
    owner: orchestrator
    owner_history: [orchestrator]
    target_artifacts: [backend/src/main/java/com/lifeos/domain/area/Area.java, backend/src/main/java/com/lifeos/domain/habit/Habit.java, backend/src/main/java/com/lifeos/domain/knowledge/Knowledge.java, backend/src/main/java/com/lifeos/domain/review/Review.java, backend/src/main/java/com/lifeos/domain/resource/Resource.java]
    resolution: "Fixed 2026-08-06 in a dedicated cleanup pass: Area, Habit, Knowledge, Review, Resource changed to @Builder(access = AccessLevel.PRIVATE) (AccessLevel imported), matching Person/Workspace/Project/Task/Goal/JournalEntry. Safe: grep confirmed no external (prod/test) call site used any of the public builders — only each factory's own create(...) calls builder() internally; the private builders are compile-time enforced and ./mvnw verify stayed green (unit 312, failsafe 33, BUILD SUCCESS on Podman). All ten domain aggregates now use a private builder."
