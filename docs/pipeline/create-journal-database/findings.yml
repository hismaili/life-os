  - id: AUD-12
    raised_by: spring-auditor
    stage: audit
    severity: Info
    symptom: "Name-only shape verification does not detect property-TYPE drift, including the Journal 'Date' column (date->text retype in Notion still returns PRESENT_MATCHING; no repair). Journal has no SELECT, so AUD-08/09 option-set concern is N/A — only the type dimension remains. Inherited from the shared adapter; not reintroduced or worsened by this service."
    evidence: "backend/src/main/java/com/lifeos/application/usecase/journal/CreateJournalDatabaseService.java:112-116 (authors Date=NotionPropertyType.DATE; verification runs through unchanged out-of-scope NotionProvisioningAdapter.verify, name-presence-only per ADR-0008)"
    citation: "Feature ADR-0012 (Consequences: verification is name-only); reused ../create-projects-database/adr/ADR-0008 (name-only verification as accepted contract); OWASP ASVS v4.0.3 V1 (security requirements explicit and risk-based) — https://owasp.org/www-project-application-security-verification-standard/"
    suspected_layer: architecture
    proposes_decision: false
    status: accepted
    owner: architecture
    owner_history: [architecture]
    target_artifacts: [docs/pipeline/create-projects-database/adr/ADR-0008-database-identity-verification-nondestructive-repair.md]
