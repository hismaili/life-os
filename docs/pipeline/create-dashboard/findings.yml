status: all-closed

findings:
  - id: QA-FAILSAFE
    stage: qa
    severity: informational
    owner: build-config
    category: quality-ci
    summary: >-
      maven-failsafe-plugin was not declared; *IT tests (CreateDashboardServiceIT,
      CreateWorkspaceIT) never ran under `verify`, only via explicit -Dtest=.
    file: backend/pom.xml
    predates_feature: true
    status: closed
    resolution: >-
      maven-failsafe-plugin added with integration-test + verify goals;
      `TESTCONTAINERS_RYUK_DISABLED=true ./mvnw verify` now runs 5 ITs (3+2) green.

  - id: AUD-01
    stage: auditor
    severity: high
    owner: implementer
    category: security-availability
    summary: >-
      Notion RestClient had no connect/read timeouts — an unbounded outbound call
      can hang a provisioning thread indefinitely.
    file: infrastructure/adapter/notion/NotionClient.java
    blocking: true
    status: closed
    resolution: >-
      Bounded connect/read timeouts added via RestClientCustomizer
      (new NotionClientConfiguration).

  - id: AUD-02
    stage: auditor
    severity: medium
    owner: implementer
    category: availability
    summary: Retry-After header honored without an upper bound; a hostile/large value could stall a thread.
    file: infrastructure/adapter/notion/NotionClient.java
    status: closed
    resolution: Retry-After sleep clamped to a sane maximum.

  - id: AUD-03
    stage: auditor
    severity: medium
    owner: implementer
    category: correctness-security
    summary: Page/database ids concatenated into URL path; should be passed as encoded URI variables.
    file: infrastructure/adapter/notion/NotionProvisioningAdapter.java
    status: closed
    resolution: Path ids passed as percent-encoded URI variables; +tests.

  - id: AUD-04
    stage: auditor
    severity: medium
    owner: implementer
    category: correctness
    summary: >-
      Orphan-adoption / dedup guarantee relied on a single /v1/search page; without
      pagination a >1 match could be missed, weakening the never-duplicate invariant.
    file: infrastructure/adapter/notion/NotionProvisioningAdapter.java
    status: closed
    resolution: Search pagination traversal added; +tests for the >1 match / FAILED path.

  - id: AUD-05
    stage: auditor
    severity: low
    owner: implementer
    category: dry
    summary: NotionClient constructed its own `new ObjectMapper()` instead of the Spring-managed bean.
    file: infrastructure/adapter/notion/NotionClient.java
    status: closed
    resolution: Shared Spring-configured ObjectMapper injected through the adapter.

  - id: AUD-06
    stage: auditor
    severity: informational
    owner: build-config
    category: quality-ci
    summary: Restatement of QA-FAILSAFE for its quality implication (ITs not gated by default build).
    file: backend/pom.xml
    duplicate_of: QA-FAILSAFE
    status: closed
    resolution: Wired maven-failsafe-plugin (see QA-FAILSAFE).

